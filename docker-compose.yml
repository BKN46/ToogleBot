version: "3"
services:
  tooglebot:
    build: .
    container_name: tooglebot
    restart: always
    ports:
      - "6099:6099"   # NapCat WebUI
      - "3000:3000"   # NapCat HTTP
      - "3001:3001"   # NapCat WS
    environment:
      - NAPCAT_UID=0
      - NAPCAT_GID=0
      - ACCOUNT=${QQ_ACCOUNT}
      - WEBUI_TOKEN=${WEBUI_TOKEN:-napcat}
    volumes:
      - ./data:/bot/data
      - ./.env:/bot/.env
      - napcat_config:/app/napcat/config
      - qq_data:/app/.config/QQ
    network_mode: bridge

volumes:
  napcat_config:
  qq_data:
